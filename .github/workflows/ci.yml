name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: Smoke findings
        run: |
          if refage examples/draft.md --bib examples/refs.bib --fail-on findings; then
            echo "expected non-zero exit for stale findings" >&2
            exit 1
          fi
      - name: Smoke clean
        run: refage examples/draft_clean.md --bib examples/refs.bib --fail-on findings
